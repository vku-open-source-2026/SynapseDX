# TLS terminator (dev): 1 nginx SNI tren 443 —
#   https://gateway.synapsedx.local -> gateway:8080 (API)
#   https://synapsedx.local         -> console:80   (UI)
# Dung kem compose chinh:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build tls
# Yeu cau: bash infra/tls/gen-cert.sh truoc, them vao hosts:
#   127.0.0.1 synapsedx.local gateway.synapsedx.local
# Production: thay cert self-signed bang LE/ACME, giu nguyen khoi tls nay.

services:
  tls:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${TLS_HOST_PORT:-8443}:443"
    volumes:
      - ./infra/tls/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/tls/certs:/certs:ro
    depends_on:
      - gateway
      - console
    networks: [synapsedx-net]

  # HSTS on gateway responses (TLS edge serves https to clients).
  gateway:
    environment:
      HSTS_ENABLED: "true"
