# Tam dung khi chua co cert LE (init-letsencrypt.sh): chi :80 de tra ACME challenge.
# Entrypoint tu chon file nay khi /etc/letsencrypt/live/$DOMAIN/fullchain.pem chua ton tai.
upstream gw {
  server gateway:8080;
}
upstream ui {
  server console:80;
}

server {
  listen 80;
  server_name @@DOMAIN@@ cloud.@@DOMAIN@@ api.@@DOMAIN@@;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    # chua TLS: tra 200 de healthcheck di qua, khong redirect vong lap
    proxy_pass http://ui;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }
}
