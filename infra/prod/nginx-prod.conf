# SynapseDX prod edge — nginx cho synapsedx.sbs.
# Domain that bang @@DOMAIN@@ luc container start (xem entrypoint.sh).
# - synapsedx.sbs + cloud.synapsedx.sbs -> console:80 (frontend; @ la web chinh,
#   nut Dang nhap redirect ve cloud theo CONSOLE_APP_URL o runtime config.js)
# - api.synapsedx.sbs -> gateway:8080 (API duy nhat public)
# - /.well-known/acme-challenge phuc vu certbot webroot (renew khong downtime)
# - rate-limit lop ngoai cho /v1/auth/* (gateway da go limiter noi tai)

# Upstreams resolve dynamically against Docker's embedded DNS (127.0.0.11) so
# a recreated console/gateway container (new IP) never leaves a stale upstream
# behind — redeploys need no edge restart.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

# ---- HTTP: ACME challenge + redirect ve https ----
server {
  listen 80;
  server_name @@DOMAIN@@ cloud.@@DOMAIN@@ api.@@DOMAIN@@;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- HTTPS: console (@ + cloud) ----
server {
  listen 443 ssl;
  server_name @@DOMAIN@@ cloud.@@DOMAIN@@;

  ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  client_max_body_size 1m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    set $ui_upstream console:80;
    proxy_pass http://$ui_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# ---- HTTPS: gateway API ----
server {
  listen 443 ssl;
  server_name api.@@DOMAIN@@;

  ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  client_max_body_size 1m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # brute-force login/refresh: siet rieng o edge (xem docs/production.md)
  location /v1/auth/ {
    limit_req zone=auth burst=20 nodelay;
    set $gw_upstream gateway:8080;
    proxy_pass http://$gw_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  location / {
    limit_req zone=api burst=100 nodelay;
    set $gw_upstream gateway:8080;
    proxy_pass http://$gw_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }
}
