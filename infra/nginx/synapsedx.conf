# Include this in the public TLS edge that owns synapsedx.sbs.
# The edge is the only component that knows the private Docker service names;
# Tier 3 still calls the public HTTPS gateway URL.
server {
  listen 443 ssl;
  server_name synapsedx.sbs;
  # Supply certificates in the host edge configuration.
  client_max_body_size 25m;
  location / {
    proxy_pass http://synapsedx-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_read_timeout 60s;
  }
}
server {
  listen 443 ssl;
  server_name cloud.synapsedx.sbs;
  client_max_body_size 25m;
  location / {
    proxy_pass http://synapsedx-console:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
