# Include this in the public TLS edge that owns synapsedx.sbs.
# The edge is the only component that knows the private Docker service name;
# Tier 3 still calls the public HTTPS gateway URL.
server {
  listen 443 ssl;
  server_name synapsedx.sbs;
  # Supply certificates in the host edge configuration.
  location / { proxy_pass http://synapsedx-gateway:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
server {
  listen 443 ssl;
  server_name cloud.synapsedx.sbs;
  location / { proxy_pass http://console:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
