apiVersion: v1
kind: Namespace
metadata:
  name: synapsedx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: synapsedx
spec:
  replicas: 2
  selector:
    matchLabels: { app: iam }
  template:
    metadata:
      labels: { app: iam }
    spec:
      containers:
        - name: iam
          image: ghcr.io/synapsedx/iam:0.3.1
          ports: [{ containerPort: 4001 }]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: database-url } } }
            - { name: IAM_JWT_SECRET, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: iam-jwt-secret } } }
            - { name: IAM_API_KEY_PEPPER, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: api-key-pepper } } }
            - { name: SYNAPSEDX_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: internal-secret } } }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: OIDC_ISSUER, value: "https://auth.example.com/application/o/synapsedx/" }
            - { name: OIDC_CLIENT_ID, value: "synapsedx-platform" }
            - { name: OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: oidc-client-secret } } }
            - { name: OIDC_REDIRECT_URI, value: "https://console.example.com/oidc/callback" }
            - { name: IAM_JWT_EXPIRES_IN, value: "3600" }
            # Production hardening (flip from dev defaults):
            - { name: NODE_ENV, value: "production" }
            - { name: IAM_ALLOW_DEV_LOGIN, value: "false" }
            - { name: IAM_ALLOW_OIDC_DEMO_CALLBACK, value: "false" }
            - { name: HSTS_ENABLED, value: "true" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
          livenessProbe: { httpGet: { path: /health, port: 4001 }, initialDelaySeconds: 10, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /health, port: 4001 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  namespace: synapsedx
spec:
  selector: { app: iam }
  ports: [{ port: 4001, targetPort: 4001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: synapsedx
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/synapsedx/gateway:0.3.1
          ports: [{ containerPort: 8080 }]
          env:
            - { name: IAM_SERVICE_URL, value: "http://iam:4001" }
            - { name: WORKFLOW_SERVICE_URL, value: "http://workflow:4002" }
            - { name: AI_SERVICE_URL, value: "http://ai:4003" }
            # Gateway MUST share the JWT secret or every Bearer check fails closed.
            - { name: IAM_JWT_SECRET, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: iam-jwt-secret } } }
            - { name: SYNAPSEDX_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: internal-secret } } }
            - { name: NODE_ENV, value: "production" }
            - { name: HSTS_ENABLED, value: "true" }
            - { name: CORS_ORIGIN, value: "https://console.example.com" }
            - { name: GATEWAY_VERIFY_APIKEY, value: "true" }
            - { name: PROXY_TIMEOUT_MS, value: "30000" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 15 }
          # readiness = aggregate /ready: chi nhan traffic khi iam + workflow deu len
          readinessProbe: { httpGet: { path: /ready, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 15 }
---
# NOTE: gateway is the ONLY public entrypoint. Terminate TLS at Ingress
# (cert-manager) in front of this Service; do not expose IAM/workflow/n8n.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: synapsedx
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow
  namespace: synapsedx
spec:
  replicas: 1
  selector:
    matchLabels: { app: workflow }
  template:
    metadata:
      labels: { app: workflow }
    spec:
      containers:
        - name: workflow
          image: ghcr.io/synapsedx/workflow:0.3.1
          ports: [{ containerPort: 4002 }]
          env:
            - { name: N8N_BASE_URL, value: "http://n8n:5678" }
            - { name: N8N_API_KEY, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: n8n-api-key } } }
            - { name: SYNAPSEDX_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: internal-secret } } }
            - { name: IAM_SERVICE_URL, value: "http://iam:4001" }
            - { name: NODE_ENV, value: "production" }
            - { name: HSTS_ENABLED, value: "true" }
            - { name: CORS_ORIGIN, value: "https://console.example.com" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
          livenessProbe: { httpGet: { path: /health, port: 4002 }, initialDelaySeconds: 15, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /health, port: 4002 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: workflow
  namespace: synapsedx
spec:
  selector: { app: workflow }
  ports: [{ port: 4002, targetPort: 4002 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: synapsedx
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai }
  template:
    metadata:
      labels: { app: ai }
    spec:
      containers:
        - name: ai
          image: ghcr.io/synapsedx/ai:0.3.1
          ports: [{ containerPort: 4003 }]
          env:
            - { name: AI_BASE_URL, value: "https://openrouter.ai/api/v1" }
            - { name: AI_API_KEY, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: ai-api-key } } }
            - { name: AI_DECISION_MODEL, value: "inception/mercury-2.5" }
            - { name: AI_LLM_MODEL, value: "apodex/apodex-1.1-mini:free" }
            - { name: AI_LLM_FALLBACK_MODEL, value: "inception/mercury-2.5" }
            - { name: AI_TIMEOUT_MS, value: "20000" }
            - { name: AI_RATE_LIMIT, value: "30" }
            - { name: AI_RETRIES, value: "2" }
            - { name: SYNAPSEDX_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapsedx-secrets, key: internal-secret } } }
            - { name: NODE_ENV, value: "production" }
            - { name: HSTS_ENABLED, value: "true" }
            - { name: CORS_ORIGIN, value: "https://console.example.com" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
          livenessProbe: { httpGet: { path: /health, port: 4003 }, initialDelaySeconds: 15, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /health, port: 4003 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: synapsedx
spec:
  selector: { app: ai }
  ports: [{ port: 4003, targetPort: 4003 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: synapsedx
spec:
  replicas: 1
  selector:
    matchLabels: { app: console }
  template:
    metadata:
      labels: { app: console }
    spec:
      containers:
        - name: console
          image: ghcr.io/synapsedx/console:0.3.1
          ports: [{ containerPort: 80 }]
          env:
            # URL gateway ma TRINH DUYET goi toi (Ingress/TLS ben ngoai) - doi theo domain that.
            - { name: SYNAPSEDX_PUBLIC_BASE_URL, value: "https://gateway.example.com" }
            - { name: CONSOLE_APP_URL, value: "https://console.example.com" }
          securityContext: { runAsNonRoot: true, runAsUser: 101, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "50m", memory: "64Mi" }, limits: { cpu: "250m", memory: "256Mi" } }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: synapsedx
spec:
  selector: { app: console }
  ports: [{ port: 80, targetPort: 80 }]
