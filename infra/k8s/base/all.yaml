apiVersion: v1
kind: Namespace
metadata:
  name: olp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: olp
spec:
  replicas: 2
  selector:
    matchLabels: { app: iam }
  template:
    metadata:
      labels: { app: iam }
    spec:
      containers:
        - name: iam
          image: ghcr.io/olp/iam:0.1.0
          ports: [{ containerPort: 4001 }]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: olp-secrets, key: database-url } } }
            - { name: IAM_JWT_SECRET, valueFrom: { secretKeyRef: { name: olp-secrets, key: iam-jwt-secret } } }
          livenessProbe: { httpGet: { path: /health, port: 4001 }, initialDelaySeconds: 10, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /health, port: 4001 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  namespace: olp
spec:
  selector: { app: iam }
  ports: [{ port: 4001, targetPort: 4001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: olp
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/olp/gateway:0.1.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: IAM_SERVICE_URL, value: "http://iam:4001" }
            - { name: WORKFLOW_SERVICE_URL, value: "http://workflow:4002" }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: olp
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow
  namespace: olp
spec:
  replicas: 1
  selector:
    matchLabels: { app: workflow }
  template:
    metadata:
      labels: { app: workflow }
    spec:
      containers:
        - name: workflow
          image: ghcr.io/olp/workflow:0.1.0
          ports: [{ containerPort: 4002 }]
          env:
            - { name: N8N_BASE_URL, value: "http://n8n:5678" }
---
apiVersion: v1
kind: Service
metadata:
  name: workflow
  namespace: olp
spec:
  selector: { app: workflow }
  ports: [{ port: 4002, targetPort: 4002 }]
