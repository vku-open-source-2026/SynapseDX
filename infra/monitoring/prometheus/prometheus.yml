# SynapseDX Prometheus — scrape gateway (/metrics) + infra exporters.
# Reload: docker compose up -d prometheus (config mounted read-only).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: [] # add Alertmanager here when needed

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8080']
        labels: { service: gateway }

  - job_name: workflow
    metrics_path: /metrics
    static_configs:
      - targets: ['workflow:4002']
        labels: { service: workflow }

  - job_name: lds
    metrics_path: /metrics
    static_configs:
      - targets: ['lds:4004']
        labels: { service: lds }

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels: { service: postgres }

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels: { service: redis }
