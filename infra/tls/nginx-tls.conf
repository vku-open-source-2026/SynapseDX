# TLS termination bang SNI: 1 cong 443 cho ca gateway API + console UI.
#   https://gateway.synapseone.local -> gateway:8080
#   https://synapseone.local         -> console:80
# Them vao hosts: 127.0.0.1 synapseone.local gateway.synapseone.local

# Upstreams resolve dynamically against Docker's embedded DNS so a recreated
# console/gateway container (new IP) never leaves a stale upstream behind.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 443 ssl;
  server_name gateway.synapseone.local;
  ssl_certificate /certs/synapseone.local.crt;
  ssl_certificate_key /certs/synapseone.local.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  # Internet-facing edge: HSTS here (backend HSTS_ENABLED stays false on plain http).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    set $gw_upstream gateway:8080;
    proxy_pass http://$gw_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  server_name synapseone.local;
  ssl_certificate /certs/synapseone.local.crt;
  ssl_certificate_key /certs/synapseone.local.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    set $ui_upstream console:80;
    proxy_pass http://$ui_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
