# TLS termination bang SNI: 1 cong 443 cho ca gateway API + console UI.
#   https://gateway.olp.local -> gateway:8080
#   https://olp.local         -> console:80
# Them vao hosts: 127.0.0.1 olp.local gateway.olp.local

upstream gw {
  server gateway:8080;
}
upstream ui {
  server console:80;
}

server {
  listen 443 ssl;
  server_name gateway.olp.local;
  ssl_certificate /certs/olp.local.crt;
  ssl_certificate_key /certs/olp.local.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://gw;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  server_name olp.local;
  ssl_certificate /certs/olp.local.crt;
  ssl_certificate_key /certs/olp.local.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://ui;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
