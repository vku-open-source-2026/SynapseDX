# TLS termination bang SNI: 1 cong 443 cho ca gateway API + console UI.
#   https://gateway.synapsedx.local -> gateway:8080
#   https://synapsedx.local         -> console:80
# Them vao hosts: 127.0.0.1 synapsedx.local gateway.synapsedx.local

upstream gw {
  server gateway:8080;
}
upstream ui {
  server console:80;
}

server {
  listen 443 ssl;
  server_name gateway.synapsedx.local;
  ssl_certificate /certs/synapsedx.local.crt;
  ssl_certificate_key /certs/synapsedx.local.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  # Internet-facing edge: HSTS here (backend HSTS_ENABLED stays false on plain http).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://gw;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  server_name synapsedx.local;
  ssl_certificate /certs/synapsedx.local.crt;
  ssl_certificate_key /certs/synapsedx.local.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://ui;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
