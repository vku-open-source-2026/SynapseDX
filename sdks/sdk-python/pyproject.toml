[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synapsedx-sdk"
version = "0.6.0"
description = "synapsedx SDK for Python (Apache-2.0)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# Pin ruff so future default-rule changes cannot break CI unexpectedly.
dev = ["pytest", "ruff==0.17.0"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Keep CI deterministic: the baseline lint gate (imports, unused names,
# syntax) instead of the moving "all recommended rules" default set.
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["synapsedx_sdk*"]
