[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synapseone-sdk"
version = "0.7.0"
description = "synapseone SDK for Python (Apache-2.0)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://synapseone.space"
Repository = "https://github.com/vku-open-source-2026/SynapseOne"
Issues = "https://github.com/vku-open-source-2026/SynapseOne/issues"

[project.optional-dependencies]
# Pin ruff so future default-rule changes cannot break CI unexpectedly.
dev = ["pytest", "ruff==0.17.0"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Keep CI deterministic: the baseline lint gate (imports, unused names,
# syntax) instead of the moving "all recommended rules" default set.
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["synapseone_sdk*", "synapsedx_sdk*"]
