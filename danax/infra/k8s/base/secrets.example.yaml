apiVersion: v1
kind: Secret
metadata:
  name: olp-secrets
  namespace: olp
type: Opaque
stringData:
  # DÙNG CHO VÍ DỤ — production dùng SealedSecrets / External Secrets, không commit secret thật.
  database-url: postgres://olp:CHANGE_ME@postgres:5432/olp
  iam-jwt-secret: CHANGE_ME_32chars_min
