name: ci

# CI cho moi nhanh TRU main (main do cd.yml phu trach: gate + publish dev npm/GHCR).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call: # tai su dung lam gate cho cd.yml

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: npm install --workspaces
      - run: npm run build --workspaces --if-present
      - run: npm run test --workspaces --if-present
      # API catalog drift gate (console try-it + AI agent + docs/api.md).
      - run: node tools/catalog-check.mjs
      # Prod-dep audit: fails only on CRITICAL (the known HIGH `braces` advisory is
      # accepted + tracked in SECURITY.md — fix would be a breaking downgrade).
      # Root-level audit covers the whole workspace tree via the root lockfile.
      - run: npm audit --omit=dev --audit-level=critical
      # Copyleft gate (zero-dep script) + SBOM artifact.
      - run: node tools/license-check.cjs --sbom sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
      - run: go vet ./... && go test ./...
        working-directory: sdks/sdk-go
      - run: pip install "./sdks/sdk-python[dev]" && pip install pip-licenses && pip-licenses --fail-on="GPL;AGPL;LGPL"
      - run: pytest sdks/sdk-python -q
      - run: ruff check sdks/sdk-python apps/inference-service && ruff format --check sdks/sdk-python apps/inference-service
      - run: docker compose config
  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
  e2e-compose:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: cp .env.example .env
      - run: docker compose up -d --build postgres redis s3 s3-init iam workflow inference gateway
      - run: |
          set -e
          for i in $(seq 1 36); do
            curl -sf http://localhost:8080/ready && break || sleep 5
          done
          curl -sf http://localhost:4001/health
          TOK=$(curl -s -XPOST http://localhost:8080/v1/auth/login -H'Content-Type: application/json' -d'{"email":"ci@acme.local","orgSlug":"acme"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['accessToken'])")
          curl -sf http://localhost:8080/v1/orgs -H"Authorization: Bearer $TOK" | grep -q acme
          curl -sf http://localhost:8080/v1/templates -H"Authorization: Bearer $TOK" | grep -q webhook-to-log
          echo E2E_OK
      - run: bash tests/e2e/api-check.sh
      - run: pip install ./sdks/sdk-python -q && SYNAPSEONE_BASE_URL=http://localhost:8080 python tests/e2e/sdk-check.py
      - run: npm install --workspaces --no-audit --no-fund -q && npm run build --workspaces --if-present -q && SYNAPSEONE_BASE_URL=http://localhost:8080 node tests/e2e/sdk-check.js
      - run: SYNAPSEONE_BASE_URL=http://localhost:8080 node tests/e2e/services-check.js
      # IAM integration nodes authenticate as the workflow service with a real
      # API key (the internal secret alone is not a caller identity).
      - name: Configure workflow IAM service key
        run: |
          set -euo pipefail
          BASE=http://localhost:8080
          TOK=$(curl -sf -XPOST "$BASE/v1/auth/login" -H'Content-Type: application/json' \
            -d '{"email":"ci@acme.local","orgSlug":"acme"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])')
          ORG=$(curl -sf "$BASE/v1/orgs" -H"Authorization: Bearer $TOK" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["id"])')
          ACC=$(curl -s -XPOST "$BASE/v1/orgs/$ORG/accounts" -H"Authorization: Bearer $TOK" \
            -H'Content-Type: application/json' -d '{"slug":"ci-workflow","displayName":"CI Workflow"}' \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("id") or d.get("account",{}).get("id",""))')
          if [ -z "$ACC" ]; then
            ACC=$(curl -sf "$BASE/v1/orgs/$ORG/accounts" -H"Authorization: Bearer $TOK" \
              | python3 -c 'import sys,json; print(next(a["id"] for a in json.load(sys.stdin) if a.get("slug")=="ci-workflow"))')
          fi
          KEY=$(curl -sf -XPOST "$BASE/v1/accounts/$ACC/keys" -H"Authorization: Bearer $TOK" \
            -H'Content-Type: application/json' -d '{"name":"workflow-showcase","scopes":["*"]}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["apiKey"])')
          test -n "$KEY"
          python3 - "$KEY" <<'PY'
          import pathlib, sys
          p = pathlib.Path('.env')
          lines = [l for l in p.read_text().splitlines() if not l.startswith('SYNAPSEONE_IAM_API_KEY=')]
          lines.append('SYNAPSEONE_IAM_API_KEY=' + sys.argv[1])
          p.write_text('\n'.join(lines) + '\n')
          PY
          docker compose up -d workflow
          for i in $(seq 1 30); do
            curl -sf http://localhost:4002/health && break || sleep 2
          done
          # Re-establish gateway -> workflow and prove every upstream is healthy
          # before the showcase starts.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ready && break || sleep 2
          done
      # Complex-workflow showcase: Decision -> Base/Faststore/IAM/LDS/Queue/Flow
      # fan-out/fan-in. The AI lane is unit-tested; set SHOWCASE_RUN_AI=1 locally
      # with inference credentials to exercise it live.
      - run: SYNAPSEONE_BASE_URL=http://localhost:8080 node tests/e2e/workflow-showcase.mjs
      - run: docker compose down -v
        if: always()
