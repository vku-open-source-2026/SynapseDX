name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate git-managed workflows
        run: npm run workflows:validate
      - name: Test (contract suites, no network)
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: synapsedx-sbom
          path: sbom.cdx.json
          retention-days: 14
      - name: Compose config
        run: docker compose config >/dev/null
      - name: Compose build
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          SYNAPSEDX_IMAGE_OWNER="$OWNER" docker compose build
      - name: Console nginx config
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          docker run --rm "ghcr.io/${OWNER}/synapsedx/console:latest" nginx -t
      - name: SDK tarball contents
        run: |
          mkdir -p /tmp/sdk-pack
          npm pack --workspace=@synapsedx/capabilities --pack-destination /tmp/sdk-pack
          TARBALL=$(ls /tmp/sdk-pack/*.tgz)
          echo "Tarball: $TARBALL"
          if tar -tzf "$TARBALL" | grep -E '(test|spec)\.(js|d\.ts)$'; then
            echo 'test artifacts must not be published' >&2
            exit 1
          fi
          tar -tzf "$TARBALL" | grep -q 'package/LICENSE'
          tar -tzf "$TARBALL" | grep -q 'package/NOTICE'
      - name: Install SDK from tarball
        run: |
          TARBALL=$(ls /tmp/sdk-pack/*.tgz)
          mkdir -p /tmp/sdk-consumer
          cd /tmp/sdk-consumer
          npm init -y >/dev/null
          npm install "$TARBALL" >/dev/null
          node -e "const m = require('@synapsedx/capabilities'); if (typeof m.CapabilitiesClient !== 'function') process.exit(1); console.log('sdk-ok')"

  console-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Build console
        run: npm run build --workspace=@synapsedx/console
      - name: Role-matrix and responsive console E2E
        run: npm run test:e2e --workspace=@synapsedx/console
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: console-playwright
          path: |
            apps/console/test-results
            apps/console/playwright-report
          retention-days: 7
