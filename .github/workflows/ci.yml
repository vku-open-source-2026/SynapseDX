name: ci

# CI cho moi nhanh TRU main (main do cd.yml phu trach: gate + publish kenh dev).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call: # tai su dung lam gate cho cd.yml

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: npm install --workspaces
      - run: npm run build --workspaces --if-present
      - run: npm run test --workspaces --if-present
      # Prod-dep audit: fails only on CRITICAL (the known HIGH `braces` advisory is
      # accepted + tracked in SECURITY.md — fix would be a breaking downgrade).
      # Root-level audit covers the whole workspace tree via the root lockfile.
      - run: npm audit --omit=dev --audit-level=critical
      # Copyleft gate (zero-dep script) + SBOM artifact.
      - run: node tools/license-check.cjs --sbom sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
      - run: go vet ./... && go test ./...
        working-directory: sdks/sdk-go
      - run: pip install "./sdks/sdk-python[dev]" && pip install pip-licenses && pip-licenses --fail-on="GPL;AGPL;LGPL"
      - run: pytest sdks/sdk-python -q
      - run: ruff check sdks/sdk-python && ruff format --check sdks/sdk-python
      - run: docker compose config
  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
  e2e-compose:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: cp .env.example .env
      - run: docker compose up -d --build postgres redis s3 s3-init iam workflow gateway
      - run: |
          set -e
          for i in $(seq 1 36); do
            curl -sf http://localhost:8080/ready && break || sleep 5
          done
          curl -sf http://localhost:4001/health
          TOK=$(curl -s -XPOST http://localhost:8080/v1/auth/login -H'Content-Type: application/json' -d'{"email":"ci@acme.local","orgSlug":"acme"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['accessToken'])")
          curl -sf http://localhost:8080/v1/orgs -H"Authorization: Bearer $TOK" | grep -q acme
          curl -sf http://localhost:8080/v1/templates -H"Authorization: Bearer $TOK" | grep -q webhook-to-log
          echo E2E_OK
      - run: bash tests/e2e/api-check.sh
      - run: pip install ./sdks/sdk-python -q && SYNAPSEDX_BASE_URL=http://localhost:8080 python tests/e2e/sdk-check.py
      - run: npm install --workspaces --no-audit --no-fund -q && npm run build --workspaces --if-present -q && SYNAPSEDX_BASE_URL=http://localhost:8080 node tests/e2e/sdk-check.js
      - run: docker compose down -v
        if: always()
