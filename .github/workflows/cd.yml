name: cd

# CD cho main: gate (tai su dung ci.yml) + publish kenh DEV cho npm/GHCR.
# - npm:  <base>-dev.<run_number> voi dist-tag `dev` (`latest` giu cho release tag v*).
# - GHCR: tag `main` + `main-<sha>` (khong dung `latest`).
# PyPI chi publish ban stable tu release.yml khi push tag v* (khong publish dev).
# Bo qua publish cho commit docs/chore: them `[skip publish]` vao message.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Publish phai tuan tu: khong cancel ban dang chay do (tranh publish do dang).
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    if: "!contains(github.event.head_commit.message, '[skip publish]')"
    permissions:
      contents: read
      packages: write
      id-token: write # npm Trusted Publishing (OIDC, no token secret)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: https://registry.npmjs.org }

      # Version dev dong tu root package.json + run number (khong commit tro lai).
      - name: Compute dev versions
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "npm=$BASE-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp dev versions (workspace only, no commit)
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['sdks/sdk-js/package.json', 'tools/cli/package.json']) {
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = '${{ steps.ver.outputs.npm }}';
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
          "
          grep -H '"version":' sdks/sdk-js/package.json tools/cli/package.json

      - run: npm install --workspace=sdks/sdk-js && npm run build --workspace=sdks/sdk-js
      - run: cp LICENSE sdks/sdk-js/LICENSE
      # Idempotent: skip packages whose exact version already exists (re-runs stay green).
      - name: Publish npm (sdk + cli, tag dev)
        run: |
          DEV="${{ steps.ver.outputs.npm }}"
          for PKG in sdk cli; do
            if npm view "@synapseone/$PKG@$DEV" version >/dev/null 2>&1; then
              echo "npm: @synapseone/$PKG@$DEV already published — skipping."
            else
              npm publish --workspace=$( [ "$PKG" = cli ] && echo tools/cli || echo sdks/sdk-js ) --tag dev --access public
            fi
          done

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push images (main channel)
        run: |
          OWNER="${{ github.repository_owner }}"
          SHA="${{ steps.ver.outputs.sha }}"
          for SVC in gateway iam workflow console; do
            case "$SVC" in
              gateway) CTX=apps/gateway ;;
              iam) CTX=apps/iam-service ;;
              workflow) CTX=apps/workflow-service ;;
              console) CTX=apps/console ;;
            esac
            docker build -t "ghcr.io/$OWNER/synapseone-$SVC:main" -t "ghcr.io/$OWNER/synapseone-$SVC:main-$SHA" "$CTX"
            docker push "ghcr.io/$OWNER/synapseone-$SVC:main"
            docker push "ghcr.io/$OWNER/synapseone-$SVC:main-$SHA"
          done

      - name: Summary
        run: |
          {
            echo "## CD (dev channel) — ${{ github.sha }}";
            echo "- npm: \`@synapseone/sdk@${{ steps.ver.outputs.npm }}\`, \`@synapseone/cli@${{ steps.ver.outputs.npm }}\` (tag \`dev\`)";
            echo "- GHCR: \`ghcr.io/${{ github.repository_owner }}/synapseone-{gateway,iam,workflow,console}:main(-${{ steps.ver.outputs.sha }})\`";
          } >> "$GITHUB_STEP_SUMMARY"
