name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: https://registry.npmjs.org }
      - run: npm run build --workspaces --if-present
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish-sdk-js:
    runs-on: ubuntu-latest
    needs: release
    # Can secret NPM_TOKEN (npm access token, automation) truoc khi job nay chay.
    if: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: https://registry.npmjs.org }
      - run: npm install --workspace=packages/sdk-js && npm run build --workspace=packages/sdk-js
      - run: cp LICENSE packages/sdk-js/LICENSE
      - run: npm publish --workspace=packages/sdk-js --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-sdk-python:
    runs-on: ubuntu-latest
    needs: release
    # Can secret PYPI_API_TOKEN (__token__ tu pypi.org) truoc khi job nay chay.
    if: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build twine
      - run: cp LICENSE packages/sdk-python/LICENSE
      - run: python -m build packages/sdk-python
      - run: twine upload dist/* --non-interactive
        working-directory: packages/sdk-python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-images:
    runs-on: ubuntu-latest
    needs: release
    permissions: { packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${GITHUB_REF_NAME#v}"
          docker build -t "ghcr.io/$OWNER/olp-gateway:$TAG" -t "ghcr.io/$OWNER/olp-gateway:latest" packages/gateway
          docker build -t "ghcr.io/$OWNER/olp-iam:$TAG" -t "ghcr.io/$OWNER/olp-iam:latest" packages/iam-service
          docker build -t "ghcr.io/$OWNER/olp-workflow:$TAG" -t "ghcr.io/$OWNER/olp-workflow:latest" packages/workflow-service
          docker build -t "ghcr.io/$OWNER/olp-console:$TAG" -t "ghcr.io/$OWNER/olp-console:latest" packages/console
          docker push "ghcr.io/$OWNER/olp-gateway:$TAG" && docker push "ghcr.io/$OWNER/olp-gateway:latest"
          docker push "ghcr.io/$OWNER/olp-iam:$TAG" && docker push "ghcr.io/$OWNER/olp-iam:latest"
          docker push "ghcr.io/$OWNER/olp-workflow:$TAG" && docker push "ghcr.io/$OWNER/olp-workflow:latest"
          docker push "ghcr.io/$OWNER/olp-console:$TAG" && docker push "ghcr.io/$OWNER/olp-console:latest"
