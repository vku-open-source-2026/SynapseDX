name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: https://registry.npmjs.org }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm run build --workspaces --if-present
      # Open-format release assets (tar.gz / whl / npm tgz — no zip/rar).
      - name: Build release assets
        run: |
          set -e
          mkdir -p release-assets
          npm pack --workspace=sdks/sdk-js --pack-destination release-assets
          npm pack --workspace=tools/cli --pack-destination release-assets
          pip install build >/dev/null
          python -m build sdks/sdk-python --outdir release-assets
          sha256sum release-assets/* > release-assets/SHA256SUMS
          ls -l release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  publish-sdk-js:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: https://registry.npmjs.org }
      - run: npm install --workspace=sdks/sdk-js && npm run build --workspace=sdks/sdk-js
      - run: cp LICENSE sdks/sdk-js/LICENSE
      - run: npm publish --workspace=sdks/sdk-js --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-sdk-python:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build twine
      - run: cp LICENSE sdks/sdk-python/LICENSE
      - run: python -m build sdks/sdk-python
      # (Khong dung if: secrets.* o day — template workflow khong cho.
      #  Thieu secret thi step fail ro rang, can sua truoc khi release.)
      - run: twine upload dist/* --non-interactive
        working-directory: sdks/sdk-python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-images:
    runs-on: ubuntu-latest
    needs: release
    permissions: { packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${GITHUB_REF_NAME#v}"
          docker build -t "ghcr.io/$OWNER/synapsedx-gateway:$TAG" -t "ghcr.io/$OWNER/synapsedx-gateway:latest" apps/gateway
          docker build -t "ghcr.io/$OWNER/synapsedx-iam:$TAG" -t "ghcr.io/$OWNER/synapsedx-iam:latest" apps/iam-service
          docker build -t "ghcr.io/$OWNER/synapsedx-workflow:$TAG" -t "ghcr.io/$OWNER/synapsedx-workflow:latest" apps/workflow-service
          docker build -t "ghcr.io/$OWNER/synapsedx-console:$TAG" -t "ghcr.io/$OWNER/synapsedx-console:latest" apps/console
          docker push "ghcr.io/$OWNER/synapsedx-gateway:$TAG" && docker push "ghcr.io/$OWNER/synapsedx-gateway:latest"
          docker push "ghcr.io/$OWNER/synapsedx-iam:$TAG" && docker push "ghcr.io/$OWNER/synapsedx-iam:latest"
          docker push "ghcr.io/$OWNER/synapsedx-workflow:$TAG" && docker push "ghcr.io/$OWNER/synapsedx-workflow:latest"
          docker push "ghcr.io/$OWNER/synapsedx-console:$TAG" && docker push "ghcr.io/$OWNER/synapsedx-console:latest"
