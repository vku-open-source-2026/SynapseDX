name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: https://registry.npmjs.org }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm install --workspaces
      - run: npm run build --workspaces --if-present
      # Open-format release assets (tar.gz / whl / npm tgz — no zip/rar).
      - name: Build release assets
        run: |
          set -e
          mkdir -p release-assets
          npm pack --workspace=sdks/sdk-js --pack-destination release-assets
          npm pack --workspace=tools/cli --pack-destination release-assets
          pip install build >/dev/null
          python -m build sdks/sdk-python --outdir release-assets
          sha256sum release-assets/* > release-assets/SHA256SUMS
          ls -l release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  publish-sdk-js:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: https://registry.npmjs.org }
      - run: npm install --workspace=sdks/sdk-js && npm run build --workspace=sdks/sdk-js
      - run: cp LICENSE sdks/sdk-js/LICENSE
      # Idempotent: skip when this exact version already exists (re-runs stay green).
      - run: |
          PKG_VER=$(node -p "require('./sdks/sdk-js/package.json').version")
          if npm view "@synapseone/sdk@$PKG_VER" version >/dev/null 2>&1; then
            echo "npm: @synapseone/sdk@$PKG_VER already published — skipping."
          else
            npm publish --workspace=sdks/sdk-js --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: https://registry.npmjs.org }
      - run: cp LICENSE tools/cli/LICENSE 2>/dev/null || true
      # Idempotent: skip when this exact version already exists (re-runs stay green).
      - run: |
          PKG_VER=$(node -p "require('./tools/cli/package.json').version")
          if npm view "@synapseone/cli@$PKG_VER" version >/dev/null 2>&1; then
            echo "npm: @synapseone/cli@$PKG_VER already published — skipping."
          else
            npm publish --workspace=tools/cli --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-sdk-python:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC, no token secret)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build
      - run: cp LICENSE sdks/sdk-python/LICENSE
      - run: python -m build sdks/sdk-python
      - name: Upload PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/sdk-python/dist/
          verbose: true
          skip-existing: true # re-runs stay green when the version already exists

  publish-images:
    runs-on: ubuntu-latest
    needs: release
    permissions: { packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${GITHUB_REF_NAME#v}"
          docker build -t "ghcr.io/$OWNER/synapseone-gateway:$TAG" -t "ghcr.io/$OWNER/synapseone-gateway:latest" apps/gateway
          docker build -t "ghcr.io/$OWNER/synapseone-iam:$TAG" -t "ghcr.io/$OWNER/synapseone-iam:latest" apps/iam-service
          docker build -t "ghcr.io/$OWNER/synapseone-workflow:$TAG" -t "ghcr.io/$OWNER/synapseone-workflow:latest" apps/workflow-service
          docker build -t "ghcr.io/$OWNER/synapseone-console:$TAG" -t "ghcr.io/$OWNER/synapseone-console:latest" apps/console
          docker push "ghcr.io/$OWNER/synapseone-gateway:$TAG" && docker push "ghcr.io/$OWNER/synapseone-gateway:latest"
          docker push "ghcr.io/$OWNER/synapseone-iam:$TAG" && docker push "ghcr.io/$OWNER/synapseone-iam:latest"
          docker push "ghcr.io/$OWNER/synapseone-workflow:$TAG" && docker push "ghcr.io/$OWNER/synapseone-workflow:latest"
          docker push "ghcr.io/$OWNER/synapseone-console:$TAG" && docker push "ghcr.io/$OWNER/synapseone-console:latest"
