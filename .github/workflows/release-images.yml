name: Release Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Build images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          SYNAPSEDX_IMAGE_OWNER="$OWNER" SYNAPSEDX_VERSION=latest docker compose build

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push images
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          for svc in capabilities gateway console; do
            local_image="ghcr.io/${OWNER}/synapsedx/${svc}:latest"
            remote="ghcr.io/${OWNER}/synapsedx/${svc}"
            docker tag "${local_image}" "${remote}:${TAG}"
            docker tag "${local_image}" "${remote}:latest"
            docker tag "${local_image}" "${remote}:sha-${SHA}"
            docker push "${remote}:${TAG}"
            docker push "${remote}:latest"
            docker push "${remote}:sha-${SHA}"
          done

      - name: Make GHCR packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          for svc in capabilities gateway console; do
            if ! gh api --method PATCH "/orgs/${OWNER}/packages/container/synapsedx%2F${svc}" -f visibility=public >/dev/null 2>&1; then
              echo "::warning::Could not set synapsedx/${svc} public; set it in GitHub package settings."
            fi
          done

      - name: Pack SDK
        run: |
          mkdir -p dist-release
          npm pack --workspace=@synapsedx/capabilities --pack-destination dist-release
          sha256sum dist-release/*.tgz > dist-release/SHA256SUMS.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/*.tgz
            dist-release/SHA256SUMS.txt
            docker-compose.yml
            docs/API.md
            docs/RUNNER.md
            docs/RELEASE.md
          body: |
            SynapseDX ${{ github.ref_name }}

            Images:
            - `ghcr.io/${{ github.repository_owner }}/synapsedx/capabilities:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsedx/gateway:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsedx/console:${{ github.ref_name }}`

            SDK tarball and checksums are attached. npm publication is handled by
            the operator-gated `sdk-v*` workflow.
