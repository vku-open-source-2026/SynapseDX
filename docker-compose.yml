name: synapsedx

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapsedx}
      POSTGRES_USER: ${POSTGRES_USER:-synapsedx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapsedx_password_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-synapsedx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [synapsedx-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [synapsedx-net]

  # Object storage S3-compatible (mac dinh S3Mock nhe, du cho MVP).
  # Production: thay image bang MinIO (quay.io/minio/minio) hoac AWS S3 that,
  # giu nguyen S3_ENDPOINT/S3_BUCKET/S3_REGION/S3 keys.
  s3:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_FILESYSTEM_ROOT: /data
    volumes:
      - s3data:/data
    ports:
      - "${S3_HOST_PORT:-9090}:9090"
    networks: [synapsedx-net]

  s3-init:
    image: amazon/aws-cli:latest
    entrypoint: ["sh", "-c", "for i in $(seq 1 30); do aws --endpoint-url http://s3:9090 --region $${AWS_DEFAULT_REGION:-us-east-1} s3 mb s3://$${S3_BUCKET:-synapsedx-core} && break || sleep 2; done; aws --endpoint-url http://s3:9090 --region $${AWS_DEFAULT_REGION:-us-east-1} s3 ls || true"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-synapsedx-core}
    depends_on:
      - s3
    networks: [synapsedx-net]

  authentik-postgres-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-synapsedx_password_change_me}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_pw_change_me}
    command: >
      sh -c "psql -h postgres -U $${POSTGRES_USER:-synapsedx} -d $${POSTGRES_DB:-synapsedx} -c \"CREATE USER authentik WITH PASSWORD '$${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_pw_change_me}';\" -c 'CREATE DATABASE authentik OWNER authentik;' || true"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [synapsedx-net]

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10
    command: server
    restart: unless-stopped
    environment:
      AUTHENTIK_POSTGRESQL__HOST: ${AUTHENTIK_POSTGRESQL__HOST:-postgres}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_pw_change_me}
      AUTHENTIK_REDIS__HOST: ${AUTHENTIK_REDIS__HOST:-redis}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change_me_authentik_secret_key_60chars_min_xxxxxxxxxxxxxxxx}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authentik-postgres-init:
        condition: service_completed_successfully
    ports:
      - "${AUTHENTIK_HTTPS_PORT:-19443}:9443"
      - "${AUTHENTIK_HTTP_PORT:-19000}:9000"
    networks: [synapsedx-net]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10
    command: worker
    restart: unless-stopped
    environment:
      AUTHENTIK_POSTGRESQL__HOST: ${AUTHENTIK_POSTGRESQL__HOST:-postgres}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_pw_change_me}
      AUTHENTIK_REDIS__HOST: ${AUTHENTIK_REDIS__HOST:-redis}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change_me_authentik_secret_key_60chars_min_xxxxxxxxxxxxxxxx}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [synapsedx-net]

  # LUU Y: OIDC_ISSUER la URL NOI BO trong mang docker (authentik-server:9000).
  # Tu browser redirect dung host port AUTHENTIK_HTTP_PORT (mac dinh 19000).
  iam:
    build:
      context: ./apps/iam-service
    image: synapsedx/iam:0.5.0
    restart: unless-stopped
    environment:
      PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER:-synapsedx}:${POSTGRES_PASSWORD:-synapsedx_password_change_me}@postgres:5432/${POSTGRES_DB:-synapsedx}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      IAM_JWT_SECRET: ${IAM_JWT_SECRET:-change_me_super_secret_32chars_min}
      IAM_JWT_EXPIRES_IN: ${IAM_JWT_EXPIRES_IN:-3600}
      IAM_REFRESH_EXPIRES_IN: ${IAM_REFRESH_EXPIRES_IN:-2592000}
      IAM_API_KEY_PEPPER: ${IAM_API_KEY_PEPPER:-}
      IAM_ALLOW_DEV_LOGIN: ${IAM_ALLOW_DEV_LOGIN:-true}
      IAM_ALLOW_OIDC_DEMO_CALLBACK: ${IAM_ALLOW_OIDC_DEMO_CALLBACK:-true}
      # Shared service-to-service credential (must match gateway + workflow).
      # Empty = dev mode (upstream warns). Production: set a random 32+ char value
      # and DO NOT publish IAM/WORKFLOW host ports.
      SYNAPSEDX_INTERNAL_SECRET: ${SYNAPSEDX_INTERNAL_SECRET:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      OIDC_PROVIDER: ${OIDC_PROVIDER:-authentik}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://authentik-server:9000/application/o/synapsedx/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-synapsedx-platform}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change_me_oidc_secret}
      OIDC_STATE_SECRET: ${OIDC_STATE_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/oidc/callback}
      OIDC_ALLOWED_ORGS: ${OIDC_ALLOWED_ORGS:-}
    ports:
      - "${IAM_HOST_PORT:-4001}:4001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [synapsedx-net]

  workflow:
    build:
      context: ./apps/workflow-service
    image: synapsedx/workflow:0.5.0
    restart: unless-stopped
    environment:
      PORT: 4002
      DATABASE_URL: postgres://${POSTGRES_USER:-synapsedx}:${POSTGRES_PASSWORD:-synapsedx_password_change_me}@postgres:5432/${POSTGRES_DB:-synapsedx}
      IAM_SERVICE_URL: ${IAM_SERVICE_URL:-http://iam:4001}
      SYNAPSEDX_INTERNAL_SECRET: ${SYNAPSEDX_INTERNAL_SECRET:-}
      SYNAPSEDX_IAM_API_KEY: ${SYNAPSEDX_IAM_API_KEY:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      WORKFLOW_CRON_TICK_MS: ${WORKFLOW_CRON_TICK_MS:-15000}
    ports:
      - "${WORKFLOW_HOST_PORT:-4002}:4002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      iam:
        condition: service_healthy
    networks: [synapsedx-net]

  ai:
    build:
      context: ./apps/ai-service
    image: synapsedx/ai:0.5.0
    restart: unless-stopped
    environment:
      PORT: 4003
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_DECISION_MODEL: ${AI_DECISION_MODEL:-inception/mercury-2.5}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-apodex/apodex-1.1-mini:free}
      AI_LLM_FALLBACK_MODEL: ${AI_LLM_FALLBACK_MODEL:-inception/mercury-2.5}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-30}
      AI_RETRIES: ${AI_RETRIES:-2}
      SYNAPSEDX_INTERNAL_SECRET: ${SYNAPSEDX_INTERNAL_SECRET:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${AI_SERVICE_HOST_PORT:-127.0.0.1:4003}:4003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [synapsedx-net]

  lds:
    build:
      context: ./apps/lds-service
    image: synapsedx/lds:0.5.0
    restart: unless-stopped
    environment:
      PORT: 4004
      DATABASE_URL: postgres://${POSTGRES_USER:-synapsedx}:${POSTGRES_PASSWORD:-synapsedx_password_change_me}@postgres:5432/${POSTGRES_DB:-synapsedx}
      SYNAPSEDX_INTERNAL_SECRET: ${SYNAPSEDX_INTERNAL_SECRET:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${LDS_SERVICE_HOST_PORT:-127.0.0.1:4004}:4004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4004/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [synapsedx-net]

  base:
    build:
      context: ./apps/base-service
    image: synapsedx/base:0.5.0
    restart: unless-stopped
    environment:
      PORT: 4005
      DATABASE_URL: postgres://${POSTGRES_USER:-synapsedx}:${POSTGRES_PASSWORD:-synapsedx_password_change_me}@postgres:5432/${POSTGRES_DB:-synapsedx}
      BASE_MAX_DOCUMENT_BYTES: ${BASE_MAX_DOCUMENT_BYTES:-262144}
      BASE_QUERY_SCAN_LIMIT: ${BASE_QUERY_SCAN_LIMIT:-10000}
      SYNAPSEDX_INTERNAL_SECRET: ${SYNAPSEDX_INTERNAL_SECRET:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${BASE_SERVICE_HOST_PORT:-127.0.0.1:4005}:4005"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4005/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [synapsedx-net]

  faststore:
    build:
      context: ./apps/faststore-service
    image: synapsedx/faststore:0.5.0
    restart: unless-stopped
    environment:
      PORT: 4006
      FASTSTORE_REDIS_URL: ${FASTSTORE_REDIS_URL:-redis://redis:6379}
      SYNAPSEDX_INTERNAL_SECRET: ${SYNAPSEDX_INTERNAL_SECRET:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${FASTSTORE_SERVICE_HOST_PORT:-127.0.0.1:4006}:4006"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4006/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks: [synapsedx-net]

  queue:
    build:
      context: ./apps/queue-service
    image: synapsedx/queue:0.5.0
    restart: unless-stopped
    environment:
      PORT: 4007
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis:6379}
      QUEUE_MAX_PAYLOAD_BYTES: ${QUEUE_MAX_PAYLOAD_BYTES:-262144}
      SYNAPSEDX_INTERNAL_SECRET: ${SYNAPSEDX_INTERNAL_SECRET:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${QUEUE_SERVICE_HOST_PORT:-127.0.0.1:4007}:4007"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4007/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks: [synapsedx-net]

  gateway:
    build:
      context: ./apps/gateway
    image: synapsedx/gateway:0.5.0
    restart: unless-stopped
    environment:
      PORT: 8080
      IAM_SERVICE_URL: ${IAM_SERVICE_URL:-http://iam:4001}
      WORKFLOW_SERVICE_URL: ${WORKFLOW_SERVICE_URL:-http://workflow:4002}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:4003}
      LDS_SERVICE_URL: ${LDS_SERVICE_URL:-http://lds:4004}
      BASE_SERVICE_URL: ${BASE_SERVICE_URL:-http://base:4005}
      FASTSTORE_SERVICE_URL: ${FASTSTORE_SERVICE_URL:-http://faststore:4006}
      QUEUE_SERVICE_URL: ${QUEUE_SERVICE_URL:-http://queue:4007}
      IAM_JWT_SECRET: ${IAM_JWT_SECRET:-change_me_super_secret_32chars_min}
      SYNAPSEDX_INTERNAL_SECRET: ${SYNAPSEDX_INTERNAL_SECRET:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      GATEWAY_VERIFY_APIKEY: ${GATEWAY_VERIFY_APIKEY:-true}
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-30000}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      iam:
        condition: service_healthy
      workflow:
        condition: service_healthy
      ai:
        condition: service_healthy
      lds:
        condition: service_healthy
      base:
        condition: service_healthy
      faststore:
        condition: service_healthy
      queue:
        condition: service_healthy
    networks: [synapsedx-net]

  console:
    build:
      context: ./apps/console
    image: synapsedx/console:0.5.0
    restart: unless-stopped
    environment:
      # URL gateway ma TRINH DUYET goi toi (khong phai ten service docker).
      SYNAPSEDX_PUBLIC_BASE_URL: ${SYNAPSEDX_PUBLIC_BASE_URL:-http://localhost:8080}
      # Canonical app URL (cloud.*): web chinh @ redirect login ve day theo env.
      CONSOLE_APP_URL: ${CONSOLE_APP_URL:-}
    ports:
      - "${CONSOLE_HOST_PORT:-3000}:80"
    depends_on:
      - gateway
    networks: [synapsedx-net]

  # ---- Monitoring (Prometheus, optional but on by default) ----
  # Tat khi khong can: docker compose stop prometheus postgres-exporter redis-exporter
  # Query UI: Prometheus bieu thuc tai http://localhost:9091 (xem docs/monitoring.md).
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    volumes:
      - prometheusdata:/prometheus
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9091}:9090"
    depends_on:
      - gateway
      - postgres-exporter
      - redis-exporter
    networks: [synapsedx-net]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgres://${POSTGRES_USER:-synapsedx}:${POSTGRES_PASSWORD:-synapsedx_password_change_me}@postgres:5432/${POSTGRES_DB:-synapsedx}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [synapsedx-net]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    networks: [synapsedx-net]

volumes:
  pgdata:
  redisdata:
  s3data:
  prometheusdata:

networks:
  synapsedx-net:
    driver: bridge
