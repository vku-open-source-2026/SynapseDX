name: olp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olp}
      POSTGRES_USER: ${POSTGRES_USER:-olp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olp_password_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-olp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [olp-net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [olp-net]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_change_me}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [olp-net]

  authentik-postgres-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-olp_password_change_me}
    command: >
      sh -c "psql -h postgres -U $${POSTGRES_USER:-olp} -d $${POSTGRES_DB:-olp} -c \"CREATE USER authentik WITH PASSWORD '$${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_pw_change_me}';\" -c 'CREATE DATABASE authentik OWNER authentik;' || true"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [olp-net]

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10
    command: server
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_pw_change_me}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change_me_authentik_secret_key_60chars_min_xxxxxxxxxxxxxxxx}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authentik-postgres-init:
        condition: service_completed_successfully
    ports:
      - "${AUTHENTIK_HTTPS_PORT:-19443}:9443"
      - "${AUTHENTIK_HTTP_PORT:-19000}:9000"
    networks: [olp-net]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10
    command: worker
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_pw_change_me}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change_me_authentik_secret_key_60chars_min_xxxxxxxxxxxxxxxx}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [olp-net]

  # LƯU Ý: OIDC_ISSUER là URL NỘI BỘ trong mạng docker (authentik-server:9000).
  # Từ browser redirect dùng host port AUTHENTIK_HTTP_PORT (mặc định 19000).
  n8n:
    image: n8nio/n8n:1.66.0
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_me_n8n_32chars_key_1234567890}
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-olp}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-olp}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-olp_password_change_me}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      N8N_API_KEY: ${N8N_API_KEY:-}
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8ndata:/home/node/.n8n
    networks: [olp-net]

  iam:
    build:
      context: ./packages/iam-service
    environment:
      PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER:-olp}:${POSTGRES_PASSWORD:-olp_password_change_me}@postgres:5432/${POSTGRES_DB:-olp}
      REDIS_URL: redis://redis:6379
      IAM_JWT_SECRET: ${IAM_JWT_SECRET:-change_me_super_secret_32chars_min}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://authentik-server:9000/application/o/olp/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-olp-platform}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change_me_oidc_secret}
    ports:
      - "${IAM_HOST_PORT:-4001}:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [olp-net]

  workflow:
    build:
      context: ./packages/workflow-service
    environment:
      PORT: 4002
      N8N_BASE_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY:-change_me_n8n_api_key}
      IAM_SERVICE_URL: http://iam:4001
    ports:
      - "${WORKFLOW_HOST_PORT:-4002}:4002"
    depends_on:
      - n8n
      - iam
    networks: [olp-net]

  gateway:
    build:
      context: ./packages/gateway
    environment:
      PORT: 8080
      IAM_SERVICE_URL: http://iam:4001
      WORKFLOW_SERVICE_URL: http://workflow:4002
      N8N_API_URL: http://n8n:5678/api/v1
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 300
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      - iam
      - workflow
    networks: [olp-net]

volumes:
  pgdata:
  redisdata:
  miniodata:
  n8ndata:

networks:
  olp-net:
    driver: bridge
