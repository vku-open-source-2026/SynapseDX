name: olp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olp}
      POSTGRES_USER: ${POSTGRES_USER:-olp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olp_password_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-olp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [olp-net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [olp-net]

  # Object storage S3-compatible (mac dinh S3Mock nhe, du cho MVP).
  # Production: thay image bang MinIO (quay.io/minio/minio) hoac AWS S3 that,
  # giu nguyen S3_ENDPOINT/S3_BUCKET/S3_REGION/S3 keys.
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_FILESYSTEM_ROOT: /data
    volumes:
      - s3data:/data
    ports:
      - "${S3_HOST_PORT:-9090}:9090"
    networks: [olp-net]

  s3-init:
    image: amazon/aws-cli:latest
    entrypoint: ["sh", "-c", "for i in $(seq 1 30); do aws --endpoint-url http://s3:9090 --region $${AWS_DEFAULT_REGION:-us-east-1} s3 mb s3://$${S3_BUCKET:-olp-core} && break || sleep 2; done; aws --endpoint-url http://s3:9090 --region $${AWS_DEFAULT_REGION:-us-east-1} s3 ls || true"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-olp-core}
    depends_on:
      - s3
    networks: [olp-net]

  authentik-postgres-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-olp_password_change_me}
    command: >
      sh -c "psql -h postgres -U $${POSTGRES_USER:-olp} -d $${POSTGRES_DB:-olp} -c \"CREATE USER authentik WITH PASSWORD '$${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_pw_change_me}';\" -c 'CREATE DATABASE authentik OWNER authentik;' || true"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [olp-net]

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10
    command: server
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_pw_change_me}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change_me_authentik_secret_key_60chars_min_xxxxxxxxxxxxxxxx}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authentik-postgres-init:
        condition: service_completed_successfully
    ports:
      - "${AUTHENTIK_HTTPS_PORT:-19443}:9443"
      - "${AUTHENTIK_HTTP_PORT:-19000}:9000"
    networks: [olp-net]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10
    command: worker
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_pw_change_me}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change_me_authentik_secret_key_60chars_min_xxxxxxxxxxxxxxxx}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [olp-net]

  # LUU Y: OIDC_ISSUER la URL NOI BO trong mang docker (authentik-server:9000).
  # Tu browser redirect dung host port AUTHENTIK_HTTP_PORT (mac dinh 19000).
  n8n:
    image: n8nio/n8n:1.66.0
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_me_n8n_32chars_key_1234567890}
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-olp}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-olp}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-olp_password_change_me}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      N8N_API_KEY: ${N8N_API_KEY:-}
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8ndata:/home/node/.n8n
    networks: [olp-net]

  iam:
    build:
      context: ./packages/iam-service
    image: olp/iam:0.1.0
    environment:
      PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER:-olp}:${POSTGRES_PASSWORD:-olp_password_change_me}@postgres:5432/${POSTGRES_DB:-olp}
      REDIS_URL: redis://redis:6379
      IAM_JWT_SECRET: ${IAM_JWT_SECRET:-change_me_super_secret_32chars_min}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://authentik-server:9000/application/o/olp/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-olp-platform}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change_me_oidc_secret}
    ports:
      - "${IAM_HOST_PORT:-4001}:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [olp-net]

  workflow:
    build:
      context: ./packages/workflow-service
    image: olp/workflow:0.1.0
    environment:
      PORT: 4002
      N8N_BASE_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY:-change_me_n8n_api_key}
      IAM_SERVICE_URL: http://iam:4001
    ports:
      - "${WORKFLOW_HOST_PORT:-4002}:4002"
    depends_on:
      - n8n
      - iam
    networks: [olp-net]

  gateway:
    build:
      context: ./packages/gateway
    image: olp/gateway:0.1.0
    environment:
      PORT: 8080
      IAM_SERVICE_URL: http://iam:4001
      WORKFLOW_SERVICE_URL: http://workflow:4002
      N8N_API_URL: http://n8n:5678/api/v1
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 300
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      - iam
      - workflow
    networks: [olp-net]

volumes:
  pgdata:
  redisdata:
  s3data:
  n8ndata:

networks:
  olp-net:
    driver: bridge
