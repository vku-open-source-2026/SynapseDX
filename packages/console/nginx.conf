server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # runtime config — never cache, entrypoint rewrites it per env
  location = /config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
