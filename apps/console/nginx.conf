server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Baseline security headers for a static admin SPA. The API lives on the
  # gateway origin (configured at runtime via /config.js), so connect-src
  # must stay open — tighter lock-down happens at the outer reverse proxy
  # (see docs/production.md). frame-ancestors blocks clickjacking of the console.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http: https: ws: wss:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

  # runtime config — never cache, entrypoint rewrites it per env
  location = /config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
