# SynapseDX Gateway routing table.
# path prefix -> upstream. Auth mode: none|jwt|apikey|either
routes:
  - path: /v1/auth
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: none

  - path: /v1/orgs
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: either

  - path: /v1/accounts
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: either

  - path: /v1/roles
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: either

  - path: /v1/users
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: either

  - path: /v1/service-accounts
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: either

  - path: /v1/policies
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: either

  - path: /v1/keys
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: either

  - path: /v1/authorize
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: either

  - path: /v1/audit
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: either

  # Usage analytics (request/feature telemetry + drill-down). Gateway writes
  # events to IAM internally; these reads are tenant-scoped in IAM.
  - path: /v1/usage
    target: ${IAM_SERVICE_URL:http://iam:4001}
    auth: either

  - path: /v1/workflows
    target: ${WORKFLOW_SERVICE_URL:http://workflow:4002}
    auth: either

  - path: /v1/templates
    target: ${WORKFLOW_SERVICE_URL:http://workflow:4002}
    auth: either

  - path: /v1/executions
    target: ${WORKFLOW_SERVICE_URL:http://workflow:4002}
    auth: either

  - path: /v1/credentials
    target: ${WORKFLOW_SERVICE_URL:http://workflow:4002}
    auth: either

  - path: /v1/accounts/*/credentials
    target: ${WORKFLOW_SERVICE_URL:http://workflow:4002}
    auth: either

  # Public inbound webhooks (P0-5): no gateway auth — the workflow-service
  # enforces per-workflow auth/rate-limit/idempotency itself.
  - path: /webhook
    target: ${WORKFLOW_SERVICE_URL:http://workflow:4002}
    auth: none
    # AI-agent lanes can take longer than the 30s global proxy default.
    # Keep this aligned with the workflow/agent 300s execution budget.
    timeoutMs: 300000

  - path: /v1/ai
    target: ${AI_SERVICE_URL:http://ai:4003}
    auth: either
    # LLM calls are slow and retried (see AI_TIMEOUT_MS/AI_RETRIES): give the
    # agent room instead of cutting it off at the 30s global default.
    timeoutMs: 120000

  # Synapse Inference Engine — LLM proxy (OpenRouter), local embeddings, Decision-2.0-Eos-0.8B
  - path: /v1/inference
    target: ${INFERENCE_SERVICE_URL:http://inference:4008}
    auth: either
    timeoutMs: 120000

  # SynapseLDS — linked data service (NGSI-LD datasources + licensed exports).
  # SynapseLDS public (anonymous) read surface — spec: public = "anyone reaching
  # the API". LDS enforces GET/HEAD-only + public-only projection for anonymous
  # callers (gateway-stamped x-synapsedx-anon marker; management routes stay
  # authenticated via the /v1/lds rule below).
  - path: /v1/lds/licenses
    target: ${LDS_SERVICE_URL:http://lds:4004}
    auth: none

  - path: /v1/lds/datasources/*/entities/*
    target: ${LDS_SERVICE_URL:http://lds:4004}
    auth: none

  - path: /v1/lds
    target: ${LDS_SERVICE_URL:http://lds:4004}
    auth: either

  # SynapseBase — self-managed document database (collections, mapping, queries).
  - path: /v1/base
    target: ${BASE_SERVICE_URL:http://base:4005}
    auth: either

  # Synapse Faststore — tenant-scoped cache, counters, data structures and locks.
  - path: /v1/faststore
    target: ${FASTSTORE_SERVICE_URL:http://faststore:4006}
    auth: either

  # SynapseQueue — message queue with visibility timeouts and dead letters.
  - path: /v1/queue
    target: ${QUEUE_SERVICE_URL:http://queue:4007}
    auth: either

  # SynapseStream — distributed event streaming log (pluggable Redis Streams / Kafka).
  - path: /v1/stream
    target: ${STREAM_SERVICE_URL:http://stream:4009}
    auth: either


