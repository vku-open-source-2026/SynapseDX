# Prod overlay cho synapsedx.sbs (dung kem compose chinh):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Edge cong khai duy nhat: nginx :80/:443 (synapsedx.sbs, cloud.*, api.* + LE).
# Moi service khac bind 127.0.0.1 qua .env (debug local), khong public.
# Authentik/s3/postgres/redis: chi trong network noi bo.

services:
  gateway:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
      GATEWAY_VERIFY_APIKEY: "true"

  iam:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
      IAM_ALLOW_DEV_LOGIN: "false"
      IAM_ALLOW_OIDC_DEMO_CALLBACK: "false"
    # Unpublish internal API in prod (gateway-only access via docker network).
    # Requires Compose v2.24+ (!reset). Fallback is .env bind 127.0.0.1.
    ports: !reset []

  workflow:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  ai:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  lds:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  prometheus:
    ports: !reset []

  console:
    environment:
      NODE_ENV: production

  # TLS terminator + Certbot webroot (renew khong downtime).
  nginx:
    build:
      context: ./infra/prod
    image: synapsedx/edge:0.4.0
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-synapsedx.sbs}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gateway
      - console
    networks: [synapsedx-net]

  certbot:
    image: certbot/certbot:latest
    restart: "no"
    # Entrypoint mac dinh cua image la `certbot`: `run --rm certbot certonly ...`
    # se thanh `certbot certonly ...`. Service thuong truc chi de giu volumes.
    entrypoint: ["certbot"]
    command: ["--version"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks: [synapsedx-net]

volumes:
  certbot-www:
  letsencrypt:
